name: Android

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "MAPKIT_API_KEY=${{ secrets.YANDEX_MAPKIT_API_KEY }}" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sector-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: debug
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check release secrets
        id: release_secrets
        shell: bash
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "Release secrets are missing; skipping release APK build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        if: steps.release_secrets.outputs.enabled == 'true'
        run: |
          echo "MAPKIT_API_KEY=${{ secrets.YANDEX_MAPKIT_API_KEY }}" > local.properties

      - name: Decode keystore
        if: steps.release_secrets.outputs.enabled == 'true'
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sector-release.jks"

      - name: Make gradlew executable
        if: steps.release_secrets.outputs.enabled == 'true'
        run: chmod +x ./gradlew

      - name: Build release
        if: steps.release_secrets.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sector-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sector-release-apk
          path: path: app/build/outputs/apk/release/*.apk

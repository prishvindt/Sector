services:
  sector-backend:
    build: .
    container_name: sector-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-/api}
      SERVER_VERSION: ${SERVER_VERSION:-0.1.0}
      SERVER_NAME: ${SERVER_NAME:-Sector self-hosted}
      OPERATOR_NAME: ${OPERATOR_NAME:-Private operator}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-private_self_hosted}
      DATA_RESIDENCY: ${DATA_RESIDENCY:-unknown}
      CRYPTO_PROFILE: ${CRYPTO_PROFILE:-production_e2e}
      RELAY_ONLY: ${RELAY_ONLY:-true}
      STORES_USER_ARCHIVE: ${STORES_USER_ARCHIVE:-false}
      PAYLOAD_TTL_SECONDS: ${PAYLOAD_TTL_SECONDS:-604800}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-604800}
      DELETE_AFTER_DELIVERY_SUPPORTED: ${DELETE_AFTER_DELIVERY_SUPPORTED:-true}
      FEATURE_REGISTRATION: ${FEATURE_REGISTRATION:-false}
      FEATURE_EMAIL_VERIFICATION: ${FEATURE_EMAIL_VERIFICATION:-false}
      FEATURE_CONTACTS: ${FEATURE_CONTACTS:-false}
      FEATURE_ENCRYPTED_OBJECTS: ${FEATURE_ENCRYPTED_OBJECTS:-false}
      FEATURE_ENCRYPTED_MEDIA: ${FEATURE_ENCRYPTED_MEDIA:-false}
      FEATURE_LIVE_LOCATION: ${FEATURE_LIVE_LOCATION:-false}
      FEATURE_CLOUD_BACKUP: ${FEATURE_CLOUD_BACKUP:-false}
      FEATURE_WEB_MAP: ${FEATURE_WEB_MAP:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sector:sector_password@postgres:5432/sector}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${PORT:-3000}:3000"

  postgres:
    image: postgres:18-alpine
    container_name: sector-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sector}
      POSTGRES_USER: ${POSTGRES_USER:-sector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sector_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: sector-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
